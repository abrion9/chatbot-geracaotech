<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GENESIS — Chatbot IA | Max Marduque</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #0f0f1a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .chat-app {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 680px;
      height: 90vh;
      max-height: 700px;
      background: #ffffff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }

    .chat-header {
      background: #1a1a2e;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .bot-avatar {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7c3aed, #06b6d4);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 14px;
      color: white;
      flex-shrink: 0;
    }

    .header-info { flex: 1; }

    .header-name {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 15px;
      color: white;
    }

    .header-status {
      font-size: 11px;
      color: #06b6d4;
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 2px;
    }

    .status-dot {
      width: 6px; height: 6px;
      background: #22c55e;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .chat-badge {
      font-size: 10px;
      background: rgba(124, 58, 237, 0.3);
      color: #a78bfa;
      padding: 3px 10px;
      border-radius: 20px;
      font-family: 'Syne', sans-serif;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #f5f5f7;
    }

    .messages-area::-webkit-scrollbar { width: 4px; }
    .messages-area::-webkit-scrollbar-thumb { background: #ccc; border-radius: 2px; }

    .msg-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
      animation: fadeUp 0.25s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg-row.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      font-size: 11px;
      font-weight: 600;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      color: white;
    }

    .msg-avatar.bot { background: linear-gradient(135deg, #7c3aed, #06b6d4); }
    .msg-avatar.user { background: #1a1a2e; }

    .msg-col { display: flex; flex-direction: column; }
    .msg-row.user .msg-col { align-items: flex-end; }

    .bubble {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.6;
      color: #1a1a1a;
    }

    .bubble.bot {
      background: #ffffff;
      border: 1px solid #e5e5e5;
      border-bottom-left-radius: 4px;
    }

    .bubble.user {
      background: #1a1a2e;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .bubble.typing {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 12px 16px;
    }

    .dot {
      width: 7px; height: 7px;
      background: #aaa;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-5px); opacity: 1; }
    }

    .msg-time {
      font-size: 10px;
      color: #999;
      margin-top: 3px;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .suggestion-btn {
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      padding: 5px 12px;
      border: 1px solid #ddd;
      border-radius: 20px;
      background: white;
      color: #555;
      cursor: pointer;
      transition: all 0.15s;
    }

    .suggestion-btn:hover {
      background: #1a1a2e;
      color: white;
      border-color: #1a1a2e;
    }

    .input-area {
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      border-top: 1px solid #e5e5e5;
      background: #ffffff;
      flex-shrink: 0;
    }

    .input-wrap { flex: 1; position: relative; }

    .chat-input {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 22px;
      padding: 10px 46px 10px 16px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      color: #1a1a1a;
      background: #f5f5f7;
      resize: none;
      outline: none;
      min-height: 42px;
      max-height: 100px;
      overflow-y: auto;
      line-height: 1.4;
      transition: border-color 0.15s;
    }

    .chat-input:focus { border-color: #7c3aed; }
    .chat-input::placeholder { color: #aaa; }

    .send-btn {
      position: absolute;
      right: 8px;
      bottom: 7px;
      width: 28px; height: 28px;
      border-radius: 50%;
      background: #1a1a2e;
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.1s, background 0.15s;
    }

    .send-btn:hover { background: #7c3aed; }
    .send-btn:active { transform: scale(0.92); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .send-btn svg { width: 13px; height: 13px; }

    .footer-hint {
      text-align: center;
      font-size: 10px;
      color: #aaa;
      padding: 6px 16px 10px;
      background: #ffffff;
    }
  </style>
</head>
<body>

<div class="chat-app">
  <div class="chat-header">
    <div class="bot-avatar">GN</div>
    <div class="header-info">
      <div class="header-name">GENESIS</div>
      <div class="header-status">
        <span class="status-dot"></span>
        Assistente com IA Generativa
      </div>
    </div>
    <div class="chat-badge">IA Gen</div>
  </div>

  <div class="messages-area" id="msgs">
    <div class="msg-row">
      <div class="msg-avatar bot">GN</div>
      <div class="msg-col">
        <div class="bubble bot">
          Olá! Sou o <strong>GENESIS</strong>, seu assistente com Inteligência Artificial. Posso te ajudar com dúvidas, textos, código, ideias e muito mais. O que você precisa hoje?
        </div>
        <div class="suggestions">
          <button class="suggestion-btn" onclick="fillInput('O que é IA Generativa?')">O que é IA Generativa?</button>
          <button class="suggestion-btn" onclick="fillInput('Me explique machine learning')">Machine learning</button>
          <button class="suggestion-btn" onclick="fillInput('Crie um poema sobre tecnologia')">Criar um poema</button>
          <button class="suggestion-btn" onclick="fillInput('Como aprender programação do zero?')">Aprender programação</button>
        </div>
        <div class="msg-time">agora</div>
      </div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-wrap">
      <textarea
        class="chat-input"
        id="chatInput"
        placeholder="Digite sua mensagem..."
        rows="1"
        onkeydown="handleKey(event)"
        oninput="autoResize(this)"
      ></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </button>
    </div>
  </div>
  <div class="footer-hint">Claude Sonnet 4 · Projeto Final Geração Tech · Max Marduque</div>
</div>

<script>
  const msgsEl = document.getElementById('msgs');
  const inputEl = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendBtn');
  let history = [];
  let isLoading = false;

  function getTime() {
    const now = new Date();
    return now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 100) + 'px';
  }

  function fillInput(text) {
    inputEl.value = text;
    autoResize(inputEl);
    inputEl.focus();
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function addMsg(text, role) {
    const row = document.createElement('div');
    row.className = 'msg-row' + (role === 'user' ? ' user' : '');

    const av = document.createElement('div');
    av.className = 'msg-avatar ' + role;
    av.textContent = role === 'user' ? 'MX' : 'GN';

    const col = document.createElement('div');
    col.className = 'msg-col';

    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + role;
    bubble.textContent = text;

    const time = document.createElement('div');
    time.className = 'msg-time';
    time.textContent = getTime();

    col.appendChild(bubble);
    col.appendChild(time);

    if (role === 'user') {
      row.appendChild(col);
      row.appendChild(av);
    } else {
      row.appendChild(av);
      row.appendChild(col);
    }

    msgsEl.appendChild(row);
    msgsEl.scrollTop = msgsEl.scrollHeight;
    return bubble;
  }

  function addTyping() {
    const row = document.createElement('div');
    row.className = 'msg-row';
    row.id = 'typing-row';

    const av = document.createElement('div');
    av.className = 'msg-avatar bot';
    av.textContent = 'GN';

    const bubble = document.createElement('div');
    bubble.className = 'bubble bot typing';
    bubble.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';

    row.appendChild(av);
    row.appendChild(bubble);
    msgsEl.appendChild(row);
    msgsEl.scrollTop = msgsEl.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById('typing-row');
    if (t) t.remove();
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || isLoading) return;

    isLoading = true;
    sendBtn.disabled = true;
    inputEl.value = '';
    inputEl.style.height = 'auto';

    addMsg(text, 'user');
    history.push({ role: 'user', content: text });

    addTyping();

    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 1000,
          system: 'Você é o GENESIS, um assistente virtual inteligente, simpático e direto ao ponto. Responda sempre em português brasileiro de forma natural, como uma conversa real. Seja útil, criativo e acolhedor. Este chatbot foi desenvolvido por Max Marduque como Projeto Final do curso Geração Tech — IA Generativa.',
          messages: history
        })
      });

      const data = await res.json();
      removeTyping();

      const reply = data.content?.[0]?.text || 'Não consegui gerar uma resposta. Tente novamente.';
      history.push({ role: 'assistant', content: reply });

      const bubble = addMsg('', 'assistant');
      let i = 0;
      const interval = setInterval(() => {
        bubble.textContent += reply[i];
        i++;
        msgsEl.scrollTop = msgsEl.scrollHeight;
        if (i >= reply.length) clearInterval(interval);
